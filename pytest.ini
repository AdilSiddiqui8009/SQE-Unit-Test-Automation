[pytest]
testpaths = tests_assignment
markers =
    smoke: one fast happy-path test per function
    ecp: equivalence class partitioning tests
    boundary: boundary value analysis tests
    negative: invalid input / error guessing tests
    datadriven: tests fed from external CSV data
    module_level: module/class level tests
    number: tests for humanize.number
    filesize: tests for humanize.filesize
    time: tests for humanize.time
    lists: tests for humanize.lists
    clamp: tests for humanize.number clamp function
    intword: tests for humanize.number intword function
    naturaldate: tests for humanize.time naturaldate function
    m2: test suite authored by Member 2 (Ibadat Ali)
    case_order: explicit run position of a test inside its group (see conftest.py)
